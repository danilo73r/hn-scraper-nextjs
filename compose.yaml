services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hn_crawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hn_crawler}
      POSTGRES_DB: ${POSTGRES_DB:-hn_crawler}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres18_data:
