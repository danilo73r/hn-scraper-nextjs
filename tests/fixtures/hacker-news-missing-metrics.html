<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Hacker News</title>
</head>

<body>
  <!-- Reduced fixture with fictional entries representing missing metrics. Created: 2026-10-04. -->
  <table id="hnmain">
    <tbody>

      <!-- Single news entry -->
      <!-- Case 1: a regular submission with points but no comments yet. -->
      <tr class="athing submission" id="2001">
        <td class="title"><span class="rank">1.</span></td>
        <td class="votelinks"><a href="vote?id=2001">upvote</a></td>
        <td class="title">
          <span class="titleline">
            <a href="https://example.com/security">A new security report</a>
          </span>
        </td>
      </tr>
      <tr>
        <td colspan="2"></td>
        <td class="subtext">
          <span class="subline">
            <span class="score" id="score_2001">15 points</span>
            by <a class="hnuser" href="user?id=alice">alice</a>
            <span class="age"><a href="item?id=2001">4 hours ago</a></span>
            | <a href="hide?id=2001">hide</a> |
            <!-- "discuss" replaces the numeric comment count; expected comments: 0. -->
            <a href="item?id=2001">discuss</a>
          </span>
        </td>
      </tr>
      <tr class="spacer"></tr>


      <!-- Single news entry -->
      <!-- Case 2: a job posting without points or comments. -->
      <tr class="athing submission" id="2002">
        <td class="title"><span class="rank">2.</span></td>
        <!-- Job postings have no upvote link. -->
        <td><img src="s.gif" height="1" width="14" alt="" /></td>
        <td class="title">
          <span class="titleline">
            <a href="https://example.com/jobs">Example company is hiring</a>
          </span>
        </td>
      </tr>
      <tr>
        <td colspan="2"></td>
        <td class="subtext">
          <!-- Only age and hide links: expected points: 0, comments: 0. -->
          <span class="age"><a href="item?id=2002">1 day ago</a></span>
          | <a href="hide?id=2002">hide</a>
        </td>
      </tr>
      <tr class="spacer"></tr>

    </tbody>
  </table>
</body>

</html>
